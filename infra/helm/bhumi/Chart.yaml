apiVersion: v2
name: bhumi
description: Bharat's Unified Mapping & Intelligence System — Helm chart
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - land-records
  - digitization
  - government
  - india
home: https://bhumi.gov.in
maintainers:
  - name: BHUMI Team
    email: dev@bhumi.gov.in
dependencies:
  - name: postgresql
    version: "15.5.23"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.6.4"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "14.7.15"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
