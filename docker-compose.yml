name: bhumi

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhumi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhumi}
      POSTGRES_USER: ${POSTGRES_USER:-bhumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhumi}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhumi} -d ${POSTGRES_DB:-bhumi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bhumi-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: bhumi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bhumiadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-bhumiadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-bhumiadmin} ${S3_SECRET_KEY:-bhumiadmin};
      mc mb -p local/${S3_BUCKET_DOCUMENTS:-bhumi-documents};
      mc mb -p local/${S3_BUCKET_MODELS:-bhumi-models};
      mc anonymous set download local/${S3_BUCKET_DOCUMENTS:-bhumi-documents};
      echo 'buckets ready';
      "

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: bhumi-api
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8000:8000"]
    volumes:
      - ./services/api:/app
      - ./ml:/ml
      - modelcache:/models
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: >
      sh -c "python -m bhumi.scripts.init_db &&
             uvicorn bhumi.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: bhumi-worker
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      C_FORCE_ROOT: "1"
    volumes:
      - ./services/api:/app
      - ./services/worker:/worker
      - ./ml:/ml
      - modelcache:/models
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    command: celery -A worker.celery_app worker --loglevel=INFO --concurrency=2 -Q pipeline,publish,learning

  beat:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: bhumi-beat
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./services/api:/app
      - ./services/worker:/worker
    depends_on:
      redis: { condition: service_healthy }
    command: celery -A worker.celery_app beat --loglevel=INFO

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: bhumi-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
      - webnodemodules:/app/node_modules
    depends_on: [api]
    command: sh -c "npm install && npm run dev"

  mock-dilrmp:
    build:
      context: .
      dockerfile: infra/docker/mock.Dockerfile
    container_name: bhumi-mock-dilrmp
    ports: ["8010:8010"]
    volumes: ["./apps/mock-dilrmp:/app"]
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bhumi-mailhog
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  webnodemodules:
